<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ULM STREET — V11</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;touch-action:none}
canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}.p{background:#0b1119dd;border:1px solid #fff2;border-radius:11px;padding:7px 10px;font-size:12px;font-weight:800;backdrop-filter:blur(8px)}
#mission{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#0b1119e8;border:1px solid #fff2;border-radius:12px;padding:8px 12px;font-size:12px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;pointer-events:none}#cross:before{content:"";position:absolute;left:0;top:7px;width:16px;height:2px;background:#fff;box-shadow:0 0 4px #000}#cross:after{content:"";position:absolute;left:7px;top:0;width:2px;height:16px;background:#fff;box-shadow:0 0 4px #000}
#controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 15px;pointer-events:none}.pad{width:150px;height:150px;position:relative;pointer-events:auto}.b{position:absolute;width:50px;height:50px;border-radius:50%;background:#0b1119bb;border:1px solid #fff3;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;box-shadow:0 5px 18px #0007;user-select:none}.u{left:50px}.d{left:50px;bottom:0}.l{left:0;top:50px}.r{right:0;top:50px}
.actions{width:165px;height:150px;position:relative;pointer-events:auto}.fire{right:0;bottom:58px!important;width:70px;height:70px;background:#c93131e8}.enter{right:72px;bottom:8px!important;background:#247caee8}.swap{right:0;bottom:8px!important;background:#6951a8e8}.weapon{right:72px;bottom:62px!important;background:#8a5a24e8}
#toast{display:none;position:fixed;bottom:172px;left:50%;transform:translateX(-50%);background:#0b1119ed;border:1px solid #fff2;border-radius:11px;padding:8px 12px;font-size:12px;font-weight:800}
#map{position:fixed;right:12px;top:58px;width:118px;height:118px;border-radius:14px;background:#081018cc;border:1px solid #fff3;box-shadow:0 6px 20px #0008;z-index:9;overflow:hidden}#map canvas{width:118px;height:118px}#speed{position:fixed;right:12px;bottom:175px;background:#0b1119dd;border:1px solid #fff2;border-radius:11px;padding:7px 10px;font:800 12px system-ui;z-index:9}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="p">💶 <span id="money">500</span> €</div><div class="p">⭐ <span id="wanted">0</span></div><div class="p">❤️ <span id="hp">100</span></div><div class="p">🔫 <span id="weapon">PISTOLE</span> <span id="ammo">12</span></div><div class="p">🎯 <span id="level">1</span></div><div class="p">🚗 <span id="mode">ZU FUSS</span></div></div>
<div id="mission">📦 BAHNHOF — Hol das Paket ab</div><div id="cross"></div><div id="toast"></div><div id="map"><canvas id="mapc" width="236" height="236"></canvas></div><div id="speed">0 km/h</div>
<div id="controls"><div class="pad"><div class="b u" data-k="f">▲</div><div class="b d" data-k="b">▼</div><div class="b l" data-k="l">◀</div><div class="b r" data-k="r">▶</div></div><div class="actions"><div class="b fire" id="fire">🔫</div><div class="b enter" id="enter">🚗</div><div class="b swap" id="swap">🔄</div><div class="b weapon" id="weaponBtn">🔫</div></div></div>
<script>
const c=document.getElementById('game'),g=c.getContext('webgl',{antialias:true});
const V=`attribute vec3 p;attribute vec3 c;uniform mat4 m;varying vec3 v;void main(){gl_Position=m*vec4(p,1.);v=c;}`;
const F=`precision mediump float;varying vec3 v;void main(){gl_FragColor=vec4(v,1.);}`;
function S(t,s){let q=g.createShader(t);g.shaderSource(q,s);g.compileShader(q);return q}
let pr=g.createProgram();g.attachShader(pr,S(g.VERTEX_SHADER,V));g.attachShader(pr,S(g.FRAGMENT_SHADER,F));g.linkProgram(pr);g.useProgram(pr);
const AP=g.getAttribLocation(pr,'p'),AC=g.getAttribLocation(pr,'c'),UM=g.getUniformLocation(pr,'m');
let P=[],C=[];
function cube(x,y,z,w,h,d,r,gg,b){
 let v=[[-w/2,0,-d/2],[w/2,0,-d/2],[w/2,h,-d/2],[-w/2,h,-d/2],[-w/2,0,d/2],[w/2,0,d/2],[w/2,h,d/2],[-w/2,h,d/2]];
 let f=[[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]],s=[.8,.72,.65,.9,1,.68];
 f.forEach((a,j)=>[0,1,2,0,2,3].forEach(i=>{let q=v[a[i]];P.push(q[0]+x,q[1]+y,q[2]+z);C.push(r*s[j],gg*s[j],b*s[j])}))
}
function car(x,z,r,gg,b){cube(x,2,z,30,12,55,r,gg,b);cube(x,14,z-4,22,8,23,.12,.18,.2);cube(x,7,z-29,4,5,3,.9,.85,.65);cube(x,7,z+29,4,5,3,.8,.08,.06)}
function npc(x,z,shirt){cube(x,0,z,10,23,10,.74,.48,.34);cube(x,23,z,11,11,11,.72,.46,.32);cube(x,5,z,14,4,12,shirt[0],shirt[1],shirt[2])}
// ULM STREET — upgraded city dressing: streets, sidewalks, blocks, water and landmarks
cube(0,-.1,0,4200,.1,3200,.16,.18,.18);

// asphalt grid
const roadXs=[-1200,-600,0,600,1200];
const roadZs=[-900,-300,300,900];
for(const rx of roadXs) cube(rx,.01,0,118,0.035,3000,.055,.065,.075);
for(const rz of roadZs) cube(0,.015,rz,3900,0.035,118,.055,.065,.075);

// sidewalks beside every main road
for(const rx of roadXs){cube(rx-82,.02,0,38,.045,3000,.36,.37,.34);cube(rx+82,.02,0,38,.045,3000,.36,.37,.34);}
for(const rz of roadZs){cube(0,.025,rz-82,3900,.045,38,.36,.37,.34);cube(0,.025,rz+82,3900,.045,38,.36,.37,.34);}

// lane markings
for(const rx of roadXs){for(let zz=-1450;zz<1450;zz+=72)cube(rx,.055,zz,3,.02,34,.78,.70,.28);}
for(const rz of roadZs){for(let xx=-1850;xx<1850;xx+=72)cube(xx,.06,rz,34,.02,3,.78,.70,.28);}

// city blocks with varied architecture
const palette=[[.28,.27,.26],[.36,.31,.28],[.22,.28,.31],[.39,.34,.29],[.25,.25,.29]];
for(let bx=-1500;bx<=1500;bx+=300)for(let bz=-1200;bz<=1200;bz+=300){
  if(Math.abs(bx)<180 || Math.abs(bz)<180) continue;
  const idx=Math.abs((bx/300)*7+(bz/300)*11)%palette.length, col=palette[idx];
  const h=42+Math.abs((bx*13+bz*7)%48);
  cube(bx,0,bz,188,h,188,col[0],col[1],col[2]);
  // roof slab
  cube(bx,h,bz,194,4,194,col[0]*.72,col[1]*.72,col[2]*.72);
  // rooftop equipment
  cube(bx-48,h+4,bz+35,24,12,22,.12,.13,.14);
  cube(bx+42,h+4,bz-38,18,9,18,.14,.15,.16);
  // window bands on two visible sides
  for(let wx=-70;wx<=70;wx+=35){cube(bx+wx,h*.45,bz-96,18,12,2,.12,.22,.27);cube(bx+wx,h*.70,bz-96,18,12,2,.12,.22,.27);}
  for(let wz=-70;wz<=70;wz+=35){cube(bx+96,h*.52,bz+wz,2,12,18,.12,.22,.27);}
}

// trees in green strips
function tree(tx,tz){
  cube(tx,0,tz,10,26,10,.23,.14,.08);
  cube(tx,24,tz,34,30,34,.10,.30,.16);
  cube(tx,42,tz,25,22,25,.08,.38,.19);
}
for(const tx of [-111,-489,489,1111]) for(let tz=-1200;tz<=1200;tz+=180) tree(tx,tz);

// Donau — broad blue water with a proper bank
cube(0,-.02,1080,3900,.03,300,.05,.22,.34);
cube(0,.02,925,3900,.05,18,.36,.42,.36);
cube(0,.02,1235,3900,.05,18,.36,.42,.36);
// bridge
cube(0,.08,1080,220,.12,320,.18,.19,.20);
for(let xx=-90;xx<=90;xx+=30)cube(xx,.2,1080,6,10,330,.16,.17,.18);

// Münster — taller, layered and more recognizable
cube(0,0,-690,150,105,118,.58,.54,.45);
cube(0,0,-745,58,330,58,.68,.63,.52);
cube(0,330,-745,76,70,76,.73,.68,.56);
cube(0,400,-745,16,65,16,.24,.22,.18);
cube(0,465,-745,7,30,7,.70,.65,.52);
for(const sx of [-18,18]) for(const sz of [-18,18]) cube(sx,270,-745+sz,8,55,8,.48,.45,.38);
// Bahnhof + shops
cube(-500,0,650,240,65,125,.32,.36,.39);
cube(-500,65,650,250,7,132,.18,.20,.22);
for(let wx=-590;wx<=-410;wx+=36)cube(wx,28,585,22,18,3,.10,.23,.28);
cube(510,0,-420,140,70,95,.34,.23,.18);
cube(510,70,-420,78,32,20,.12,.12,.12);
cube(720,0,420,155,52,120,.31,.33,.35);

// street lamps and signs
for(const rx of roadXs) for(let zz=-1050;zz<=1050;zz+=180){
  cube(rx-62,0,zz,4,45,4,.07,.07,.07); cube(rx-55,44,zz,14,4,4,.12,.12,.12);
  cube(rx+62,0,zz,4,45,4,.07,.07,.07); cube(rx+55,44,zz,14,4,4,.12,.12,.12);
}

// traffic
for(let i=0;i<13;i++)car(-80+i*18,-220-i*145,i%3===0?.75:i%3===1?.08:.12,i%3===0?.10:i%3===1?.35:.32,i%3===0?.08:i%3===1?.7:.7);
for(let i=0;i<24;i++)npc(-270+(i%12)*45,250+Math.floor(i/12)*60,i%2?[.12,.35,.7]:[.65,.12,.12]);
// street lamps
for(let z=-1000;z<1000;z+=120){cube(-108,0,z,4,45,4,.07,.07,.07);cube(108,0,z,4,45,4,.07,.07,.07)}
const vb=g.createBuffer(),cb=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,vb);g.bufferData(g.ARRAY_BUFFER,new Float32Array(P),g.STATIC_DRAW);g.bindBuffer(g.ARRAY_BUFFER,cb);g.bufferData(g.ARRAY_BUFFER,new Float32Array(C),g.STATIC_DRAW);
function mul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function persp(f,a,n,z){let t=1/Math.tan(f/2),o=new Float32Array(16);o[0]=t/a;o[5]=t;o[10]=(z+n)/(n-z);o[11]=-1;o[14]=2*z*n/(n-z);return o}
function view(x,y,z,yaw,pitch){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),fx=sy*cp,fy=sp,fz=-cy*cp,rx=cy,rz=sy,ux=-sy*sp,uy=cp,uz=cy*sp;return new Float32Array([rx,ux,-fx,0,0,uy,-fy,0,rz,uz,-fz,0,-(rx*x+rz*z),-(uy*y+ux*x+uz*z),fx*x+fy*y+fz*z,1])}
let x=0,y=42,z=650,yaw=0,pitch=-.04,carMode=false,ammo=12,money=500,wanted=0,step=0;const k={f:0,b:0,l:0,r:0};
document.querySelectorAll('[data-k]').forEach(e=>{e.onpointerdown=q=>{q.preventDefault();k[e.dataset.k]=1};e.onpointerup=e.onpointercancel=e.onpointerleave=()=>k[e.dataset.k]=0});
addEventListener('keydown',e=>{let m={w:'f',ArrowUp:'f',s:'b',ArrowDown:'b',a:'l',ArrowLeft:'l',d:'r',ArrowRight:'r'};if(m[e.key])k[m[e.key]]=1});addEventListener('keyup',e=>{let m={w:'f',ArrowUp:'f',s:'b',ArrowDown:'b',a:'l',ArrowLeft:'l',d:'r',ArrowRight:'r'};if(m[e.key])k[m[e.key]]=0});
let drag=0,lx=0,ly=0;c.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY};c.onpointermove=e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw+=dx*.006;pitch=Math.max(-1.1,Math.min(1.1,pitch-dy*.005))};c.onpointerup=c.onpointercancel=()=>drag=0;
function toast(t){let q=document.getElementById('toast');q.textContent=t;q.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>q.style.display='none',1000)}
document.getElementById('enter').onpointerdown=()=>{carMode=!carMode;document.getElementById('mode').textContent=carMode?'AUDI RS':'ZU FUSS';toast(carMode?'🚗 Im Auto':'🚶 Zu Fuß')};
document.getElementById('swap').onpointerdown=()=>{ammo=12;document.getElementById('ammo').textContent=ammo;toast('🔄 Nachgeladen')};
document.getElementById('fire').onpointerdown=()=>{if(!carMode&&ammo){ammo--;wanted=Math.min(5,wanted+1);document.getElementById('ammo').textContent=ammo;document.getElementById('wanted').textContent=wanted;money+=5;document.getElementById('money').textContent=money;toast('💥 Schuss')}else if(!ammo)toast('Keine Munition')};
function resize(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;g.viewport(0,0,c.width,c.height)}resize();addEventListener('resize',resize);
function loop(){
 movePlayer(); drawMap();
 if(step===0&&Math.hypot(x,z-650)<150){step=1;document.getElementById('mission').innerHTML='⛪ <b>MÜNSTER</b> — Geh/Fahr zum Münster'}
 if(step===1&&Math.hypot(x,z+745)<175){step=2;money+=300;document.getElementById('money').textContent=money;document.getElementById('mission').innerHTML='🌊 <b>DONAU</b> — Freie Fahrt'}
 g.enable(g.DEPTH_TEST);g.enable(g.CULL_FACE);g.clearColor(.16,.22,.28,1);g.clear(g.COLOR_BUFFER_BIT|g.DEPTH_BUFFER_BIT);
 g.bindBuffer(g.ARRAY_BUFFER,vb);g.enableVertexAttribArray(AP);g.vertexAttribPointer(AP,3,g.FLOAT,false,0,0);g.bindBuffer(g.ARRAY_BUFFER,cb);g.enableVertexAttribArray(AC);g.vertexAttribPointer(AC,3,g.FLOAT,false,0,0);
 g.uniformMatrix4fv(UM,false,mul(persp(1.04,innerWidth/innerHeight,.1,4200),view(x,y,z,yaw,pitch)));g.drawArrays(g.TRIANGLES,0,P.length/3);requestAnimationFrame(loop)
}/*loop disabled in V8*/;

// V9 production-direction gameplay layer
const baseP=P.slice(), baseC=C.slice();
const weapons=[
 {name:'PISTOLE',ammo:12,max:12,damage:35,range:28,wanted:1},
 {name:'SMG',ammo:30,max:30,damage:20,range:34,wanted:2},
 {name:'SHOTGUN',ammo:6,max:6,damage:70,range:18,wanted:3}
];
let weaponIndex=0, weapon=weapons[0], hp=100, cooldown=0, heat=0, sprint=false, speedKmh=0, level=1, xp=0;
const solid=[];
for(let xx=-1500;xx<=1500;xx+=300)for(let zz=-1000;zz<=1000;zz+=300){if(Math.abs(xx)<170||Math.abs(zz)<170)continue;solid.push([xx,zz,185,185]);}
const dynCars=[{x:-24,z:625,a:0,s:4.0,color:[.05,.35,.75]},{x:24,z:642,a:Math.PI,s:3.2,color:[.75,.08,.08]},{x:0,z:675,a:0,s:3.6,color:[.75,.55,.08]},{x:-38,z:655,a:0,s:2.8,color:[.12,.65,.35]}];
const dynPeds=[{x:-10,z:618,t:0,hp:100},{x:12,z:632,t:1,hp:100},{x:30,z:660,t:2,hp:100},{x:-30,z:670,t:3,hp:100},{x:18,z:690,t:4,hp:100},{x:0,z:610,t:5,hp:100}];
let police=[];
let missionIndex=0;
const missions=[
 ['📦 BAHNHOF — Hol das Paket ab',650,300,'Paket abgeholt'],
 ['⛪ MÜNSTER — Bring das Paket zum Münster',-745,500,'Lieferung abgeschlossen'],
 ['🚗 HAUPTSTRASSE — Flieh vor der Polizei',520,650,'Abgeschüttelt'],
 ['🌊 DONAU — Triff deinen Kontakt',-120,950,'Kontakt getroffen'],
 ['💰 FREIES SPIEL — Erkunde Ulm',0,0,'Ulm gehört dir']
];
function setMission(i){missionIndex=i;document.getElementById('mission').innerHTML=missions[i][0];}
function gainXP(n){xp+=n;if(xp>=level*100){xp-=level*100;level++;toast('⬆️ LEVEL '+level);}}
function dist2(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function spawnPolice(){if(wanted<=0||police.length>=Math.min(5,wanted+1))return;let a=Math.random()*Math.PI*2;police.push({x:x+Math.cos(a)*55,z:z+Math.sin(a)*55,a:a,s:4.2+Math.random()*1.4,shoot:0});}
function blocked(nx,nz){for(const b of solid){if(nx>b[0]-b[2]/2-8&&nx<b[0]+b[2]/2+8&&nz>b[1]-b[3]/2-8&&nz<b[1]+b[3]/2+8)return true}return false}
function movePlayer(){let sp=carMode?2.4:(sprint?1.35:.85);if(k.f){let nx=x+Math.sin(yaw)*sp,nz=z-Math.cos(yaw)*sp;if(!blocked(nx,nz)){x=nx;z=nz}}if(k.b){let nx=x-Math.sin(yaw)*sp,nz=z+Math.cos(yaw)*sp;if(!blocked(nx,nz)){x=nx;z=nz}}if(k.l)yaw-=carMode?.024:.034;if(k.r)yaw+=carMode?.024:.034;speedKmh=(k.f||k.b)?Math.round((carMode?72:(sprint?16:9))):0;document.getElementById('speed').textContent=speedKmh+' km/h'}
function v9Update(dt){
 cooldown=Math.max(0,cooldown-dt);heat=Math.max(0,heat-dt);
 for(const car of dynCars){car.x+=Math.cos(car.a)*car.s*dt;car.z+=Math.sin(car.a)*car.s*dt;if(car.x>55)car.x=-55;if(car.x<-55)car.x=55;if(car.z>710)car.z=590;if(car.z<590)car.z=710;}
 for(const p of dynPeds){p.t+=dt;p.x+=Math.cos(p.t*1.1+p.t)*.7*dt;p.z+=Math.sin(p.t*1.3+p.t)*.7*dt;}
 for(const q of police){let dx=x-q.x,dz=z-q.z,d=Math.hypot(dx,dz);q.a=Math.atan2(dz,dx);q.x+=Math.cos(q.a)*q.s*dt;q.z+=Math.sin(q.a)*q.s*dt;q.s=4.2+Math.min(2,wanted*.35);q.shoot=Math.max(0,q.shoot-dt);if(d<18&&q.shoot<=0&&!carMode){q.shoot=.9;hp=Math.max(0,hp-6);toast('🚓 POLIZEI FEUERT');}}
 if(wanted>0&&Math.random()<dt*.7)spawnPolice();
 if(wanted>0&&police.length===0&&Math.random()<dt*.12)wanted--;
 if(wanted===0)police=[];
 if(hp<=0){hp=100;money=Math.max(0,money-100);wanted=0;police=[];x=0;z=650;toast('💀 Festgenommen — 100 € verloren');}
 // Mission progression
 if(missionIndex===0&&Math.hypot(x,z-650)<130){money+=150;gainXP(40);setMission(1);toast('📦 Paket abgeholt +150 €')}
 else if(missionIndex===1&&Math.hypot(x,z+745)<160){money+=350;gainXP(80);setMission(2);toast('⛪ Lieferung +350 €')}
 else if(missionIndex===2&&wanted===0){money+=500;gainXP(100);setMission(3);toast('🚓 Polizei abgehängt +500 €')}
 else if(missionIndex===3&&Math.hypot(x+120,z-950)<160){money+=600;gainXP(120);setMission(4);toast('🌊 Kontakt getroffen +600 €')}
 document.getElementById('hp').textContent=hp;document.getElementById('wanted').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);document.getElementById('money').textContent=money;document.getElementById('level').textContent=level;
}
function drawDynamic(){
 P.length=0;C.length=0;P.push(...baseP);C.push(...baseC);
 for(const car of dynCars){
 let [r,g,b]=car.color;
 cube(car.x,3,car.z,7,2.8,13,r,g,b);
 cube(car.x,5.2,car.z-.7,5.2,1.7,6.2,r*.82,g*.82,b*.82);
 cube(car.x-2.4,2.6,car.z-4.1,1.1,1.1,2,.025,.025,.025);
 cube(car.x+2.4,2.6,car.z-4.1,1.1,1.1,2,.025,.025,.025);
 cube(car.x-2.4,2.6,car.z+4.1,1.1,1.1,2,.8,.08,.05);
 cube(car.x+2.4,2.6,car.z+4.1,1.1,1.1,2,.8,.08,.05);
 cube(car.x,6.2,car.z-3.9,3.8,.5,.8,.75,.75,.65);
}
 for(const p of dynPeds){cube(p.x,2,p.z,1,3.5,1,.08,.35,.65);cube(p.x,4.2,p.z,.9,1,.9,.75,.55,.35)}
