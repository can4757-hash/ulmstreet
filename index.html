<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ULM STREET V4 — 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87a8bb;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;touch-action:none;color:#fff}
canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:7px;pointer-events:none}
.p{background:#10151bcc;border:1px solid #fff2;border-radius:11px;padding:7px 10px;font-weight:800;font-size:13px}
#mission{position:fixed;top:58px;left:50%;transform:translateX(-50%);background:#10151bdc;border:1px solid #fff2;border-radius:12px;padding:8px 12px;font-size:13px;white-space:nowrap}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}.before{}
#cross:before{width:14px;height:2px;top:6px}.cross:after{width:2px;height:14px;left:6px}
#cross:after{content:"";position:absolute;width:2px;height:14px;left:6px;top:0;background:#fff;box-shadow:0 0 4px #000}
#controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}
.stick{width:145px;height:145px;border-radius:50%;position:relative;pointer-events:auto;background:#ffffff08}
.b{position:absolute;width:50px;height:50px;border-radius:50%;background:#10151baa;border:1px solid #fff3;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;user-select:none}
.u{left:47px;top:0}.d{left:47px;bottom:0}.l{left:0;top:47px}.r{right:0;top:47px}
.look{width:150px;height:145px;pointer-events:auto;position:relative}.fire{right:0;bottom:15px;width:68px;height:68px;background:#d43b3bd9}
#hint{position:fixed;bottom:165px;left:50%;transform:translateX(-50%);background:#10151bc9;padding:7px 10px;border-radius:10px;font-size:12px;display:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><div class="p">💶 <span id="money">500</span> €</div><div class="p">⭐ <span id="wanted">0</span></div><div class="p">❤️ <span id="hp">100</span></div></div>
<div id="mission">📍 <b>BAHNHOF</b> — Geh zum Bahnhof</div>
<div id="cross"></div><div id="hint"></div>
<div id="controls">
 <div class="stick"><div class="b u" data-k="f">▲</div><div class="b d" data-k="b">▼</div><div class="b l" data-k="l">◀</div><div class="b r" data-k="r">▶</div></div>
 <div class="look"><div class="b fire" id="action">●</div></div>
</div>
<script>
const canvas=document.getElementById('gl'),gl=canvas.getContext('webgl',{antialias:true});
if(!gl){document.body.innerHTML='<h2 style="padding:30px">WebGL wird auf diesem Gerät nicht unterstützt.</h2>'}
const vs=`attribute vec3 p;attribute vec3 c;uniform mat4 m;varying vec3 v;void main(){gl_Position=m*vec4(p,1.);v=c;}`;
const fs=`precision mediump float;varying vec3 v;void main(){gl_FragColor=vec4(v,1.);}`;
function sh(t,s){let z=gl.createShader(t);gl.shaderSource(z,s);gl.compileShader(z);return z}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const ap=gl.getAttribLocation(prog,'p'),ac=gl.getAttribLocation(prog,'c'),um=gl.getUniformLocation(prog,'m');
let pos=[],col=[];
function cube(x,y,z,w,h,d,r,g,b){
 const X=x+w/2,Y=y+h/2,Z=z+d/2,x0=x-w/2,x1=x+w/2,y0=y,y1=y+h,z0=z-d/2,z1=z+d/2;
 const V=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
 const F=[[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]];
 F.forEach((f,fi)=>{let shade=[.82,.72,.62,.9,1,.68][fi];[0,1,2,0,2,3].forEach(i=>{let q=V[f[i]];pos.push(...q);col.push(r*shade,g*shade,b*shade)})});
}
function plane(){cube(0,-.08,0,4000,.1,3000,.18,.21,.2)}
plane();
for(let x=-1200;x<=1200;x+=260)for(let z=-900;z<=900;z+=260){
 if(Math.abs(x)<150||Math.abs(z)<150)continue;
 let h=30+Math.random()*55,w=170,d=170;
 cube(x,0,z,w,h,d,.28+.05*Math.random(),.25+.05*Math.random(),.24+.05*Math.random());
 // rooftop
 cube(x,h,z,w+.5,1,d+.5,.12,.12,.12);
}
// road strips
cube(0,.01,0,4000,.02,210,.10,.11,.11);cube(0,.02,0,210,.03,3000,.10,.11,.11);
// Münster complex ahead
cube(0,0,-560,125,120,100,.62,.56,.43);
cube(0,0,-620,42,285,42,.67,.62,.49);
cube(0,285,-620,48,70,48,.72,.67,.54);
// simple roof/tower
cube(0,355,-620,12,25,12,.28,.25,.20);
for(let i=-2;i<=2;i++)cube(i*23,0,-535,12,42,10,.55,.50,.40);
// street lamps
for(let z=-700;z<800;z+=120){cube(-95,0,z,4,45,4,.08,.08,.08);cube(95,0,z,4,45,4,.08,.08,.08)}
// cars
for(let i=0;i<9;i++){let x=-80+i*20;cube(x,8,-250-i*130,14,9,28,.55,.08+.05*(i%2),.06+.08*(i%3))}
const vbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pos),gl.STATIC_DRAW);
const cbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,cbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(col),gl.STATIC_DRAW);
function matMul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function perspective(fov,asp,n,f){let t=1/Math.tan(fov/2),o=new Float32Array(16);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o}
function view(px,py,pz,yaw,pitch){let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let fx=sy*cp,fy=sp,fz=-cy*cp;let rx=cy,rz=sy;let ux=-sy*sp,uy=cp,uz=cy*sp;return new Float32Array([rx,ux,-fx,0,0,uy,-fy,0,rz,uz,-fz,0,-(rx*px+rz*pz),-(uy*py+ux*px+uz*pz),fx*px+fy*py+fz*pz,1])}
let px=0,py=35,pz=650,yaw=0,pitch=-.03;const k={f:0,b:0,l:0,r:0};let money=500,wanted=0,step=0;
document.querySelectorAll('[data-k]').forEach(e=>{e.onpointerdown=ev=>{ev.preventDefault();k[e.dataset.k]=1};e.onpointerup=e.onpointercancel=e.onpointerleave=()=>k[e.dataset.k]=0});
addEventListener('keydown',e=>{let m={w:'f',ArrowUp:'f',s:'b',ArrowDown:'b',a:'l',ArrowLeft:'l',d:'r',ArrowRight:'r'};if(m[e.key])k[m[e.key]]=1});
addEventListener('keyup',e=>{let m={w:'f',ArrowUp:'f',s:'b',ArrowDown:'b',a:'l',ArrowLeft:'l',d:'r',ArrowRight:'r'};if(m[e.key])k[m[e.key]]=0});
// drag look
let lx=0,ly=0,drag=false;canvas.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};canvas.onpointermove=e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw+=dx*.006;pitch=Math.max(-1.15,Math.min(1.15,pitch-dy*.005))};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;
document.getElementById('action').onpointerdown=()=>{money+=10;document.getElementById('money').textContent=money;document.getElementById('hint').textContent='💥 Aktion';document.getElementById('hint').style.display='block';setTimeout(()=>document.getElementById('hint').style.display='none',500)};
function resize(){let d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}resize();addEventListener('resize',resize);
function tick(){
 let sp=.9;if(k.f) {px+=Math.sin(yaw)*sp;pz-=Math.cos(yaw)*sp}if(k.b){px-=Math.sin(yaw)*sp;pz+=Math.cos(yaw)*sp}
 if(k.l)yaw-=.035;if(k.r)yaw+=.035;
 px=Math.max(-1900,Math.min(1900,px));pz=Math.max(-1400,Math.min(1400,pz));
 if(step===0&&Math.hypot(px,pz-650)<150){step=1;document.getElementById('mission').innerHTML='⛪ <b>ULMER MÜNSTER</b> — Geh zum Münster';}
 if(step===1&&Math.hypot(px,pz+560)<170){step=2;money+=300;document.getElementById('money').textContent=money;document.getElementById('mission').innerHTML='🌊 <b>DONAU</b> — Freie Fahrt';}
 gl.enable(gl.DEPTH_TEST);gl.clearColor(.42,.56,.64,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.bindBuffer(gl.ARRAY_BUFFER,vbuf);gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,cbuf);gl.enableVertexAttribArray(ac);gl.vertexAttribPointer(ac,3,gl.FLOAT,false,0,0);
 let P=perspective(1.05,innerWidth/innerHeight,.1,4000),V=view(px,py,pz,yaw,pitch);gl.uniformMatrix4fv(um,false,matMul(P,V));gl.drawArrays(gl.TRIANGLES,0,pos.length/3);
 requestAnimationFrame(tick)
}tick();
</script></body></html>
